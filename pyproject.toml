[tool.poetry]
name = "djangodrf"
version = "0.1.0"
description = ""
authors = ["IvanPro91 <ivan-don4encko@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.1.0"
psycopg2-binary = "^2.9.10"
django = "^5.2.3"
djangorestframework = "^3.16.0"
pillow = "^11.2.1"
django-filter = "^25.1"
flake8 = "^7.3.0"
isort = "^6.0.1"
black = "^25.1.0"
mypy = "^1.17.1"
djangorestframework-simplejwt = "^5.5.1"
requests = "^2.32.5"
drf-yasg = "^1.21.10"
stripe = "^12.4.0"
celery = "^5.5.3"
redis = "^6.4.0"
django-celery-beat = "^2.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'